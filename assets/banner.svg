    <g transform="translate(58 42)"><rect width="224" height="34" rx="8" fill="#3D5146"/><text x="16" y="22" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text><text y="112" fill="#3D5146" font-family="Arial,sans-serif" font-size="68" font-weight="900" letter-spacing="-3">PANEL <tspan fill="#E97962">049</tspan></text><text x="2" y="151" fill="#7A9E84" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing=".7">LIMITED-COLOUR WOODCUT · HAND-CARVED MARKS · WARM PAPER · BROKEN EDGES</text><text x="2" y="198" fill="#3D5146" font-family="sans-serif" font-size="18" font-weight="800">把照片最动人的记忆，刻成一枚清新的限色版画</text><text x="2" y="230" fill="#5C6F62" font-family="sans-serif" font-size="14" font-weight="700">写真の心に残る記憶を、爽やかな限定色の版画に刻む</text><text x="2" y="260" fill="#5C6F62" font-family="sans-serif" font-size="14" font-weight="700">사진의 가장 인상적인 기억을 맑은 제한색 판화로 새기기</text><text x="2" y="291" fill="#5C6F62" font-family="Arial,sans-serif" font-size="13" font-weight="700">نقش أكثر ذكريات الصورة تأثيراً في طبعة خشبية منعشة محدودة الألوان</text></g>
