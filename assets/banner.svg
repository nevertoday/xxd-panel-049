<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 049</title><desc>A fresh limited-colour woodcut derived from each source: recognisable reduction, imperfect carved marks, matte ink, broken edges, warm paper, and quiet editorial type.</desc>
